[project]
name = "schemify"
version = "0.1.0"
description = "Build JSON Schemas interactively, and fill JSON data from them, from the command line."
readme = "README.md"
authors = [
    { name = "aaltatan", email = "a.altatan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "typer-di>=0.1.5",
    "typer-swissknife>=0.1.1",
]

[project.scripts]
schemify = "schemify.cli.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["typer_swissknife"]
ignore_missing_imports = true
